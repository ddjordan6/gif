<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giphy GIF Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="text-center py-5">
        <div class="container">
            <h1>Giphy GIF Finder</h1>
            <p class="lead">Search for your favorite GIFs and display them on the page.</p>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <h2>Find a GIF</h2>
            <div class="row g-2">
                <div class="col-md-9">
                    <label for="search-input" class="visually-hidden">Search for a GIF</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Search for a GIF...">
                </div>
                <div class="col-md-3">
                    <button id="fetch-gif" type="button" class="btn btn-primary w-100">
                        Fetch a GIF
                    </button>
                </div>
            </div>
        </section>

        <section class="results-section">
            <h2>GIF Results</h2>
            <div id="gif-container" class="row"></div>
        </section>
    </main>

    <footer class="text-center py-4">
        <p>&copy; 2026 Giphy GIF Finder</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
